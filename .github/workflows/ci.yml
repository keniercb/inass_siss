# SGP quality pipeline (plan S1.3: Pint -> PHPStan 8 -> deptrac -> Pest vs
# real MySQL 8.4 -> coverage thresholds -> Docker build). Runs on every PR
# and on pushes to main; `main` is deployable to staging.
name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'download/**'
      - 'upload/**'
      - 'worklog.md'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'download/**'
      - 'upload/**'
      - 'worklog.md'
      - '**.md'

jobs:
  quality:
    name: Quality gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sgp_test
          MYSQL_USER: sgp
          MYSQL_PASSWORD: sgp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sgp_test
      DB_USERNAME: sgp
      DB_PASSWORD: sgp_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ matrix.php }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Coding style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Module boundaries (deptrac)
        run: vendor/bin/deptrac analyse --fail-on-uncovered

      - name: Tests + coverage (Pest vs MySQL 8.4)
        run: vendor/bin/pest --coverage --min=80

      - name: Shared module coverage gate (>= 95 %)
        run: vendor/bin/pest -c phpunit.shared.xml --coverage --min=95

      - name: Docker build
        run: docker build -t sgp-backend:ci .
