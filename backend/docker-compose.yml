# SGP full stack (architecture doc, section 14): app + web + db + queue + scheduler.
# Usage: docker compose up -d --build   (from the backend/ directory)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: staging
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sgp
      DB_USERNAME: sgp
      DB_PASSWORD: ${DB_PASSWORD:-sgp_secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      # Task 39 (user correction, SGP-33): regenerate the OpenAPI spec on
      # every docs request. The persistent app-storage volume otherwise
      # serves a spec cached from a previous image, so the catalog Schema
      # de Entrada went stale after the Task 38 fields were incorporated.
      # Staging browses the docs occasionally; the annotation scan only
      # costs on /api/docs. Keep false in production (ADR-13) and generate
      # at deploy time instead.
      L5_SWAGGER_GENERATE_ALWAYS: true
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sgp
      MYSQL_USER: sgp
      MYSQL_PASSWORD: ${DB_PASSWORD:-sgp_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      - db-backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: staging
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sgp
      DB_USERNAME: sgp
      DB_PASSWORD: ${DB_PASSWORD:-sgp_secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: staging
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sgp
      DB_USERNAME: sgp
      DB_PASSWORD: ${DB_PASSWORD:-sgp_secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-storage:
  app-public:
  db-data:
  db-backups:
